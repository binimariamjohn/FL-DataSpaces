#version: '3.8'

networks:
  fl-network:
    driver: bridge

volumes:
  # Client 1 (Data Provider 1) Volumes
  client-1-nextcloud-storage:
  client-1-nextcloud-db:
  client-1-data:

  # Client 2 (Data Provider 2) Volumes
  client-2-nextcloud-storage:
  client-2-nextcloud-db:
  client-2-data:

  # Client 3 (Data Provider 3) Volumes
  client-3-nextcloud-storage:
  client-3-nextcloud-db:
  client-3-data:

  # Client 4 (Data Provider 4) Volumes
  client-4-nextcloud-storage:
  client-4-nextcloud-db:
  client-4-data:

  # Client 5 (Data Provider 5) Volumes
  client-5-nextcloud-storage:
  client-5-nextcloud-db:
  client-5-data:

  # Client 6 (Data Provider 6) Volumes
  client-6-nextcloud-storage:
  client-6-nextcloud-db:
  client-6-data:

  # Client 7 (Data Provider 7) Volumes
  client-7-nextcloud-storage:
  client-7-nextcloud-db:
  client-7-data:

  # Client 8 (Data Provider 8) Volumes
  client-8-nextcloud-storage:
  client-8-nextcloud-db:
  client-8-data:

  # Client 9 (Data Provider 9) Volumes
  client-9-nextcloud-storage:
  client-9-nextcloud-db:
  client-9-data:

  # Client 10 (Data Provider 10) Volumes
  client-10-nextcloud-storage:
  client-10-nextcloud-db:
  client-10-data:

  # Research Centre 1 Volumes
  research-centre-nextcloud-storage:
  research-centre-nextcloud-db:
  research-centre-data:

services:
  # Client 1

  client-1-cloud-db:
    image: postgres:13
    container_name: client-1-cloud-db
    networks:
      - fl-network
    restart: always
    volumes:
      - client-1-nextcloud-db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=pdbnextcloud
      - POSTGRES_USER=pdbadmin
      - POSTGRES_PASSWORD=pdb123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdbadmin -d pdbnextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5

  client-1-nextcloud:
    image: nextcloud:25
    container_name: client-1-nextcloud
    networks:
      - fl-network
    restart: always
    ports:
      - "8081:80"
    volumes:
      - client-1-nextcloud-storage:/var/www/html
      - client-1-data:/data/client_1
    environment:
      - POSTGRES_HOST=client-1-cloud-db
      - POSTGRES_DB=pdbnextcloud
      - POSTGRES_USER=pdbadmin
      - POSTGRES_PASSWORD=pdb123
      - NEXTCLOUD_ADMIN_USER=padmin
      - NEXTCLOUD_ADMIN_PASSWORD=p123
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost client-1-nextcloud client-2-nextcloud client-3-nextcloud client-4-nextcloud client-5-nextcloud client-6-nextcloud research-centre-nextcloud
      - PHP_MEMORY_LIMIT=1024M
      - PHP_UPLOAD_LIMIT=512M
      - APACHE_BODY_LIMIT=0
    depends_on:
      client-1-cloud-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  client-1-connector:
    image: edc-ionos-nextcloud:1.0
    container_name: client-1-connector
    networks:
      - fl-network
    ports:
      - "8181:8181" # API
      - "8182:8182" # Management
      - "8282:8282" # Protocol
      - "8283:8283" # Control
      - "8284:8284" # Public
    volumes:
      - ./configs/resources/client-1-resources:/resources
    environment:
      EDC_FS_CONFIG: /resources/config.properties
    depends_on:
      client-1-nextcloud:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "curl -f -X POST -H 'X-API-Key: password' -H 'Content-Type: application/json' http://localhost:8182/management/v3/assets/request -d '{\"@context\":{\"@vocab\":\"https://w3id.org/edc/v0.0.1/ns/\"},\"@type\":\"QuerySpec\"}'"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
  # Federated learning containers

  marketplace-webapp:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.fl-trainer
    container_name: marketplace-webapp
    networks:
      - fl-network
    ports:
      - "5001:5001"
    volumes:
      - .:/app
    command: python3 dataspace/marketplace/dataspace_web_app.py
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  client-1-trainer:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.fl-trainer
    container_name: client-1-trainer
    networks:
      - fl-network
    volumes:
      - .:/app
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - client-1-nextcloud-storage:/nextcloud-data
    command: python3 fedLearning/fl_client.py
    environment:
      - PYTHONUNBUFFERED=1
      - CLIENT_ID=client-1

