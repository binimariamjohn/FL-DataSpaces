  # NS3 Simulator

  ns3-simulator:
    build:
      context: .
      dockerfile: docker-images/Dockerfile.ns3
    ports:
      - "9099:9099"
    networks:
      - fl-network
    environment:
      NUM_CLIENTS: ${NUM_CLIENTS:-2}
      NS3_NETWORK_TYPE: ${NS3_NETWORK_TYPE:-ethernet}
      NS3_NETWORK_MODE: ${NS3_NETWORK_MODE:-sync}
      NS3_PACKET_SIZE: ${NS3_PACKET_SIZE:-1024}
      NS3_MODEL_SIZE: ${NS3_MODEL_SIZE:-9500}
      NS3_CLIENT_DATA_RATE: ${NS3_CLIENT_DATA_RATE:-2048kbps}
      NS3_SERVER_DATA_RATE: ${NS3_SERVER_DATA_RATE:-10000kbps}
      NS3_PORT: 9099
      RUN_ID: ${RUN_ID:-default}
      LOGS_PATH: /results/${RUN_ID:-default}
      RESULTS_PATH: /results/${RUN_ID:-default}
    volumes:
      - ${NS3_HOST_LOGS_PATH:-../logs}:/logs
      - ${NS3_HOST_RESULTS_PATH:-../results}:/results
